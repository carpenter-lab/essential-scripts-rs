[package]
name = "essential-scripts-rs"
version = "0.5.1"
edition = "2024"
description = "A set of useful tools for data wrangling"
publish = false
license = "MIT"
categories = ["command-line-utilities", "science::bioinformatics"]

[dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help", "string"] }
indicatif = "0.18"
rand = { version = "0.10", optional = true }
parasail-rs = { version = "0.9", optional = true }
calamine = "0.36"
tokio = { version = "1.52", features = ["full"] }
regex = "1.12"
md5 = "0.8"
walkdir = "2.5"
rayon = "1.12"
num_cpus = "1.17"
reqwest = { version = "0.13", features = ["json", "form", "multipart"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
plotters-cairo = { version = "0.9", optional = true }
cairo-rs = { version = "0.22", optional = true, features = ["pdf"] }
clap-binary-enum = "0.1"

[dependencies.polars]
version = "0.54"
features = ["lazy", "strings", "concat_str", "timezones", "dtype-array"]

[dependencies.plotters]
version = "0.3.7"
optional = true
default-features = false
features = ["svg_backend", "bitmap_backend", "ttf", "bitmap_encoder"]

[features]
default = []
enrichment = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:plotters", "dep:plotters-cairo", "dep:cairo-rs"]
tcr = ["dep:parasail-rs", "dep:rand"]

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = "thin"

[profile.release.package."*"]
opt-level = 3

[dev-dependencies]
polars-testing = "0.54"
pretty_assertions = "1.4"
rstest = "0.26"
tempfile = "3.27"
assert_cmd = "2.2"
