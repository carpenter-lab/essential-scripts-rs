[package]
name = "essential-scripts-rs"
version = "0.2.0"
edition = "2024"
description = "A set of useful tools for data wrangling"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
rand = "0.10"
parasail-rs = "0.9"
calamine = "0.34"

[dependencies.polars]
version = "0.53"
features = ["lazy", "strings", "concat_str", "timezones"]

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = "thin"

[profile.release.package."*"]
opt-level = 3

[dev-dependencies]
polars-testing = "0.53"
pretty_assertions = "1.4"
